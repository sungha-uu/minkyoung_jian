<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5f0">
  <meta name="description" content="섹시한 꾼만두의 레시피와 개선 기록을 한곳에서 관리하는 주방 노트">
  <title>꾼의 주방 — 레시피 노트</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="꾼의 주방 홈">
        <span class="brand-mark"><img src="assets/images/logo.png" alt=""></span>
        <span><b>꾼의 주방</b><small>RECIPE ARCHIVE</small></span>
      </a>

      <nav class="main-nav" aria-label="주 메뉴">
        <button class="nav-item is-active" data-view="recipes"><span class="nav-icon">⌂</span><span>레시피 보관함</span><b id="recipeCount">0</b></button>
        <button class="nav-item" data-view="ingredients"><span class="nav-icon">◇</span><span>재료 보관함</span><b>12</b></button>
        <button class="nav-item" data-view="lab"><span class="nav-icon">✦</span><span>메뉴 개발실</span><i>준비중</i></button>
      </nav>

      <div class="sidebar-section">
        <p>메뉴 분류</p>
        <button class="category-link is-active" data-category="all"><span style="--dot:#eb5d43"></span>전체 메뉴</button>
        <button class="category-link" data-category="mandu"><span style="--dot:#ed9b45"></span>만두</button>
        <button class="category-link" data-category="noodle"><span style="--dot:#5b9a81"></span>면 요리</button>
        <button class="category-link" data-category="special"><span style="--dot:#826eb4"></span>별미 · 사이드</button>
      </div>

      <div class="sidebar-foot">
        <div class="sync-status"><span></span><div><b>GitHub 동기화</b><small>모든 변경사항 저장됨</small></div></div>
        <p>레시피는 샘플 데이터입니다</p>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="mobile-menu" id="menuButton" aria-label="메뉴 열기">☰</button>
        <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="메뉴, 재료로 검색" autocomplete="off"><kbd>⌘ K</kbd></label>
        <div class="top-actions">
          <span class="today" id="today"></span>
          <button class="icon-button" id="printButton" title="현재 레시피 인쇄" aria-label="인쇄">↗</button>
          <button class="avatar" title="주방 관리자">꾼</button>
        </div>
      </header>

      <section class="workspace">
        <div class="page-heading">
          <div><p class="eyebrow">KITCHEN NOTE</p><h1>오늘도, 한결같은 맛</h1><p>우리 가게의 레시피와 변화를 차곡차곡 기록합니다.</p></div>
          <div class="heading-actions">
            <span class="sample-pill">샘플 레시피</span>
            <button class="primary-button" id="newRecipeButton"><span>＋</span> 새 레시피</button>
          </div>
        </div>

        <div class="content-grid">
          <section class="recipe-library" aria-label="레시피 목록">
            <div class="filter-row">
              <div id="filterTitle"><b>전체 레시피</b><span id="visibleCount"></span></div>
              <button class="sort-button" id="sortButton">최근 수정순 <span>⌄</span></button>
            </div>
            <div class="recipe-list" id="recipeList"></div>
            <div class="empty-state" id="emptyState" hidden><span>⌕</span><b>찾는 레시피가 없어요</b><p>다른 검색어나 메뉴 분류를 선택해 보세요.</p></div>
          </section>

          <article class="recipe-detail" id="recipeDetail" aria-live="polite"></article>
        </div>
      </section>
    </main>
  </div>

  <nav class="mobile-tabs" aria-label="모바일 주 메뉴">
    <button class="is-active"><span>⌂</span>레시피</button>
    <button data-mobile-toast><span>◇</span>재료</button>
    <button data-mobile-toast><span>✦</span>개발실</button>
    <button data-mobile-menu><span>☰</span>더보기</button>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
      <span class="modal-icon">✦</span>
      <h2 id="modalTitle">실제 레시피를 받을 준비가 됐어요</h2>
      <p>UI 확정 후 메뉴별 재료, 계량, 공정, 문제점을 알려주시면 실제 데이터로 교체하고 개선 이력을 버전별로 쌓아갈 수 있습니다.</p>
      <button class="primary-button" id="modalOkay">확인</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
